name: Deploy BIOVERSE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # URL backend production diisi lewat repo variable API_BASE_URL
      # (Settings -> Secrets and variables -> Actions -> Variables), BUKAN
      # di-hardcode di sini. Kalau belum diisi, build tetap jalan tapi
      # app akan memakai alamat development (lihat lib/config/api_config.dart)
      # yang tidak bisa diakses dari GitHub Pages sampai backend sungguhan
      # di-deploy dan variable ini diisi dengan URL HTTPS publiknya.
      - name: Build Flutter Web
        run: |
          flutter build web --release --base-href "/BioVerse/" \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web